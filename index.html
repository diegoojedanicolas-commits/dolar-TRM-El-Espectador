<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRM Colombia</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--rojo:#c8102e;--negro:#111;--fondo:#f5f3ef;}
body{margin:0;background:var(--fondo);font-family:Arial,sans-serif}
.hero{background:#111;color:#fff;padding:35px 20px;border-bottom:4px solid var(--rojo)}
.container{max-width:1100px;margin:auto;padding:20px}
.trm{font-size:3rem;color:#c8102e;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:20px 0}
.card,.calc{background:#fff;padding:16px;border-radius:4px}
.tabs button{padding:10px 15px;border:none;margin-right:5px;cursor:pointer}
canvas{background:#fff;padding:10px;border-radius:4px}
input{width:100%;padding:10px;margin:8px 0}
button.action{background:#c8102e;color:#fff;border:none;padding:10px 15px;cursor:pointer}
.result{font-weight:bold;margin-top:8px}
</style></head><body>
<div class="hero"><div class="container">
<h1>TRM del dólar en Colombia</h1>
<div class="trm" id="actual"></div>
<p>Fuente: Superintendencia Financiera de Colombia</p>
</div></div>

<div class="container">
<div class="cards">
<div class="card"><h4>Variación anual</h4><div id="anual"></div></div>
<div class="card"><h4>Máximo 12 meses</h4><div id="max"></div></div>
<div class="card"><h4>Mínimo 12 meses</h4><div id="min"></div></div>
<div class="card"><h4>Registros</h4><div id="registros"></div></div>
</div>

<div class="tabs">
<button onclick="setRange(7)">7 días</button>
<button onclick="setRange(30)">30 días</button>
<button onclick="setRange(365)">12 meses</button>
</div>

<canvas id="chart"></canvas>

<div class="cards" style="margin-top:20px">
<div class="calc">
<h3>USD → COP</h3>
<input id="usd" type="number" placeholder="Ingrese dólares">
<button class="action" onclick="usdToCop()">Calcular</button>
<div id="usdResult" class="result"></div>
</div>

<div class="calc">
<h3>COP → USD</h3>
<input id="cop" type="number" placeholder="Ingrese pesos colombianos">
<button class="action" onclick="copToUsd()">Calcular</button>
<div id="copResult" class="result"></div>
</div>
</div>

<p><b>Actualización manual:</b> agregue una nueva línea dentro del arreglo <code>trmData</code>.</p>
</div>
